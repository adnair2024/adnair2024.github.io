<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace">
  <rect width="1200" height="630" fill="#0b0d12"/>
  <rect x="0" y="0" width="1200" height="44" fill="#141821"/>
  <rect x="0" y="43" width="1200" height="1" fill="#222837"/>
  <rect x="10" y="6" width="80" height="32" rx="6" fill="#8ab4f8"/>
