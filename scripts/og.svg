  <rect x="616" y="514" width="560" height="80" rx="10" fill="#11141c" stroke="#2a3142"/>
  <text x="634" y="545" font-size="22" font-weight="700" fill="#e6e8ee">odyssey</text>
  <text x="634" y="574" font-size="15" fill="#9aa3b5">An RPG that lives in Discord</text>
